<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TU comprobación</title>
<script src="vendor/supabase.js"></script>
<script src="vendor/jszip.min.js"></script>
<style>
  :root { --turia:#0b3d6b; --tu:#f29a1f; --bg:#f4f6f9; --card:#fff; --line:#dde3ea; --ok:#1f8a4c; --warn:#b26a00; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:#1d2530; }
  header { background:var(--turia); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .logo { font-weight:800; font-size:20px; line-height:1; }
  .logo b { color:var(--tu); }
  .logo small { display:block; font-weight:500; font-size:12px; opacity:.9; }
  nav { display:flex; flex-wrap:wrap; }
  nav button { background:none; border:0; color:#cfe0f2; padding:8px 10px; cursor:pointer; font-size:14px; }
  nav button.on { color:#fff; border-bottom:2px solid var(--tu); }
  .badge { background:var(--tu); color:#fff; border-radius:99px; padding:1px 7px; font-size:11px; margin-left:4px; }
  main { padding:16px; max-width:960px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  h2 { margin:0 0 12px; font-size:18px; color:var(--turia); }
  h3 { margin:14px 0 8px; font-size:15px; color:var(--turia); }
  label { display:block; font-size:13px; margin:10px 0 4px; color:#4a5566; }
  label.ck { display:flex; gap:8px; align-items:flex-start; color:#1d2530; font-size:14px; }
  label.ck input { width:auto; margin-top:3px; }
  input, select, textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; font-size:15px; font-family:inherit; }
  input:disabled { background:#f0f2f5; color:#6b7787; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .row { grid-template-columns:1fr; } }
  button { font-family:inherit; }
  button.primary { background:var(--turia); color:#fff; border:0; padding:10px 16px; border-radius:6px; font-size:15px; cursor:pointer; }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--turia); border:1px solid var(--turia); padding:7px 12px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.danger { background:#fff; color:var(--bad); border:1px solid var(--bad); padding:7px 12px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.sm { padding:4px 9px; font-size:13px; }
  a.wa { display:inline-block; background:#1f8a4c; color:#fff; padding:9px 14px; border-radius:6px; text-decoration:none; font-size:14px; margin:6px 6px 0 0; }
  .acciones { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag { display:inline-block; font-size:12px; padding:3px 8px; border-radius:99px; background:#eef2f7; white-space:nowrap; }
  .tag.ok { background:#e3f4ea; color:var(--ok); } .tag.warn { background:#fff3dc; color:var(--warn); } .tag.bad { background:#fde7e5; color:var(--bad); }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.devuelto td { background:#fff6f5; }
  .muted { color:#6b7787; font-size:13px; }
  .total { font-size:22px; font-weight:700; color:var(--turia); }
  .alert { background:#fff3dc; border:1px solid #f0c674; padding:10px; border-radius:8px; margin:10px 0; font-size:14px; }
  .alert.bad { background:#fde7e5; border-color:#f3b1ab; }
  .alert.ok { background:#e3f4ea; border-color:#a9d9bc; }
  .thumb { width:44px; height:44px; object-fit:cover; border-radius:4px; cursor:pointer; border:1px solid var(--line); display:block; }
  .bar { height:8px; background:var(--turia); border-radius:4px; min-width:2px; }
  .hidden { display:none !important; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1d2530; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:30; max-width:92vw; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  #modal img { max-width:95vw; max-height:92vh; border-radius:6px; }
  #busy { position:fixed; inset:0; background:rgba(244,246,249,.6); display:flex; align-items:center; justify-content:center; z-index:20; font-size:15px; color:var(--turia); font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="logo">Turia<b>TU</b><small>comprobación</small></div>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="card muted">Cargando…</div></main>
<div id="toast" class="toast hidden"></div>
<div id="busy" class="hidden">Procesando…</div>
<div id="modal" class="hidden" onclick="this.classList.add('hidden')"><img alt="Ticket"></div>

<script>
/* ===== Conexión (la llave publicable es pública por diseño; la seguridad está en RLS y funciones del servidor) ===== */
const SB_URL = 'https://msxmdesnrqjiajvhlwop.supabase.co';
const SB_KEY = 'sb_publishable_G7idBQGtjoQvEfKK81qz9Q_PzCMRn7G';
const DOMINIO = 'usuarios.tucomprobacion.app';  // correo interno de cada usuario: <usuario>@DOMINIO
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, storageKey: 'tuc-auth' } });

const CONCEPTOS = [
  {id:'desayuno', nombre:'Desayuno', comidaIndividual:true},
  {id:'almuerzo', nombre:'Almuerzo', comidaIndividual:true},
  {id:'comida_cliente', nombre:'Comida con cliente', cliente:true, porPersona:true},
  {id:'cafe_cliente', nombre:'Café con cliente', cliente:true, porPersona:true},
  {id:'peaje', nombre:'Peaje'},
  {id:'combustible', nombre:'Combustible'},
  {id:'parqueadero', nombre:'Parqueadero'},
  {id:'obsequio', nombre:'Obsequio', obsequio:true},
  {id:'hospedaje', nombre:'Hospedaje'},
];
const ROLES = {vendedor:'Vendedor', lider:'Líder', autorizador:'Autorizador', caja:'Caja menor', contabilidad:'Contabilidad', admin:'Administrador'};
const PAGOS = {tarjeta:'Tarjeta de crédito', anticipo:'Anticipo', caja:'Caja menor'};
const MEDIOS = {tarjeta:'Tarjeta', efectivo:'Efectivo', anticipo:'Anticipo', caja:'Caja menor'};
const ESTADO_PER = {abierto:'abierto', enviado:'en revisión', devuelto:'devuelto', autorizado:'autorizado', finiquitado:'finiquitado'};
const ESTADO_ANT = {solicitado:'solicitado', autorizado:'autorizado por jefe', rechazado:'rechazado', depositado:'depositado', comprobado:'comprobado'};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ACT = 'tuc_act';
const INACTIVIDAD = 30*60*1000;   // 30 minutos
const DIA_LIMITE = 5;             // radicación: primeros 5 días del mes
const DIAS_CLAVE = 90;            // cambio de contraseña cada 90 días

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + Math.round(Number(n||0)).toLocaleString('es-CO');
const hoy = () => new Intl.DateTimeFormat('en-CA', {timeZone:'America/Bogota'}).format(new Date());
const mesActual = () => hoy().slice(0,7);
function mesAnterior(p = mesActual(), n = 1){ let [y,m] = p.split('-').map(Number); m -= n; while(m < 1){ m += 12; y--; } return `${y}-${String(m).padStart(2,'0')}`; }
function mesNombre(p){ const [y,m] = p.split('-').map(Number); return `${MESES[m-1]} ${y}`; }
function ultimoDia(p){ const [y,m] = p.split('-').map(Number); return `${p}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`; }
const diasDesde = f => Math.floor((Date.now() - new Date(f + 'T00:00:00').getTime()) / 86400000);
const sum = (arr, f = x => x.valor) => arr.reduce((s, x) => s + Number(f(x) || 0), 0);
const concepto = id => CONCEPTOS.find(c => c.id === id) || {id, nombre:id};
const nombreConcepto = id => concepto(id).nombre;
const tabla = html => `<div class="tw"><table>${html}</table></div>`;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 3500); }
function uuid(){ if(crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join(''); return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`; }
function wa(tel, texto){
  const n = String(tel || '').replace(/\D/g, '');
  const num = n ? (n.length === 10 ? '57' + n : n) : '';
  return `https://wa.me/${num}?text=${encodeURIComponent(texto)}`;
}
const btnWa = (etiqueta, tel, texto) => `<a class="wa" target="_blank" rel="noopener" href="${wa(tel, texto)}">WhatsApp: ${esc(etiqueta)}</a>`;
const emailDe = login => `${login}@${DOMINIO}`;

/* ===== Datos (Supabase) ===== */
let db = {usuarios:[], gastos:[], periodos:[], anticipos:[], topes:{}, centros:[], sesion:null};
let fotoUrls = {};          // ruta de la foto -> URL firmada
let vista = 'inicio', per = null, editId = null, editUser = null, aviso = null, dper = null;
let nuevoGastoId = null, subidas = new Set();

const mapU = r => ({id:r.id, login:r.login, nombre:r.nombre, puesto:r.puesto, rol:r.rol, autoriza:r.autoriza, pago:r.pago, centro:r.centro,
  credito:Number(r.credito), montoCaja:Number(r.monto_caja), encargado:r.encargado, telefono:r.telefono, activo:r.activo, bloqueado:r.bloqueado,
  cambiarClave:r.cambiar_clave, claveFecha:r.clave_fecha, sinAutorizador:!!r.sin_autorizador});
const mapG = r => ({id:r.id, userId:r.user_id, periodo:r.periodo, fecha:r.fecha, concepto:r.concepto, valor:Number(r.valor), centro:r.centro, medio:r.medio,
  empresa:r.empresa, personas:r.personas, nPersonas:r.n_personas, cliente:r.cliente, fuera:r.fuera, factura:r.factura, comentario:r.comentario,
  devolucion:r.devolucion, estado:r.estado, corregido:r.corregido, fotoPath:r.foto_path, fotoArchivada:r.foto_archivada});
const num = v => v == null ? null : Number(v);
const mapP = r => ({userId:r.user_id, periodo:r.periodo, estado:r.estado, enviado:r.enviado, envios:r.envios, autorizado:r.autorizado,
  finiquitado:r.finiquitado, exportado:r.exportado, total:num(r.total), anticipo:num(r.anticipo), diferencia:num(r.diferencia)});
const mapA = r => ({id:r.id, userId:r.user_id, monto:Number(r.monto), motivo:r.motivo, estado:r.estado, fecha:r.fecha, autorizado:r.autorizado,
  autorizadoPor:r.autorizado_por, rechazo:r.rechazo, depositado:r.depositado, periodo:r.periodo});

async function todo(q){ // trae todas las filas, de 1000 en 1000
  const out = [];
  for(let i = 0; ; i += 1000){
    const {data, error} = await q().range(i, i + 999);
    if(error) throw new Error(error.message);
    out.push(...data); if(data.length < 1000) return out;
  }
}
async function cargar(){
  const desde = mesAnterior(mesActual(), 12);
  const [u, g, p, a, t, c] = await Promise.all([
    todo(() => sb.from('perfiles').select('*').order('nombre')),
    todo(() => sb.from('gastos').select('*').or(`estado.neq.pagado,periodo.gte.${desde}`).order('fecha')),
    todo(() => sb.from('periodos').select('*')),
    todo(() => sb.from('anticipos').select('*').order('fecha')),
    todo(() => sb.from('topes').select('*')),
    todo(() => sb.from('centros').select('*').order('nombre')),
  ]);
  db.usuarios = u.map(mapU); db.gastos = g.map(mapG); db.periodos = p.map(mapP); db.anticipos = a.map(mapA);
  db.topes = Object.fromEntries(t.map(x => [x.concepto, Number(x.valor)])); db.centros = c.map(x => x.nombre);
  const faltan = db.gastos.filter(x => x.fotoPath && !fotoUrls[x.fotoPath]).map(x => x.fotoPath);
  for(let i = 0; i < faltan.length; i += 100){
    const {data} = await sb.storage.from('tickets').createSignedUrls(faltan.slice(i, i + 100), 4 * 3600);
    (data || []).forEach(d => { if(d.signedUrl && d.path) fotoUrls[d.path] = d.signedUrl; });
  }
}
function limpiarError(m){ return String(m || 'Error').replace(/^.*?ERROR:\s*/,''); }
async function rpc(fn, args = {}){ const {data, error} = await sb.rpc(fn, args); if(error) throw new Error(limpiarError(error.message)); return data; }
async function adminUsuarios(body){
  const {data, error} = await sb.functions.invoke('admin-usuarios', {body});
  if(error){ let m = error.message; try { m = (await error.context.json()).error || m; } catch(e){} throw new Error(m); }
  return data;
}
async function ejecutar(fn){
  $('#busy').classList.remove('hidden');
  try { await fn(); }
  catch(e){ console.error(e); toast(e.message === 'Failed to fetch' ? 'Sin conexión. Intente de nuevo.' : e.message); }
  finally { $('#busy').classList.add('hidden'); }
}
async function refrescar(msg){ await cargar(); if(validarSesion()) { render(); if(msg) toast(msg); } }

const usuario = id => db.usuarios.find(u => u.id === id);
const yo = () => usuario(db.sesion);
const activos = () => db.usuarios.filter(u => u.activo !== false);
const puedeComprobar = u => ['vendedor','lider','caja'].includes(u.rol);
const puedeAutorizar = u => ['lider','autorizador','admin'].includes(u.rol);
const autorizaA = u => db.usuarios.filter(x => x.autoriza === u.id && x.id !== u.id);
const contabilidad = () => activos().find(u => u.rol === 'contabilidad');
const perRec = (uid, p) => db.periodos.find(x => x.userId === uid && x.periodo === p);
const estadoPer = (uid, p) => perRec(uid, p)?.estado || 'abierto';
const gastosDe = (uid, p) => db.gastos.filter(g => g.userId === uid && g.periodo === p).sort((a,b) => a.fecha.localeCompare(b.fecha));
const saldoTarjeta = u => u.credito - sum(db.gastos.filter(g => g.userId === u.id && g.medio === 'tarjeta' && g.estado !== 'pagado'));
const disponibleCaja = u => u.montoCaja - sum(db.gastos.filter(g => g.userId === u.id && g.estado !== 'pagado'));
const anticipoAbierto = u => db.anticipos.find(a => a.userId === u.id && !['comprobado','rechazado'].includes(a.estado));
const debeCambiarClave = u => u.cambiarClave || (u.claveFecha && diasDesde(u.claveFecha) >= DIAS_CLAVE);
const tagEstado = e => `<span class="tag ${({autorizado:'ok',finiquitado:'ok',aprobado:'ok',pagado:'ok',devuelto:'bad',rechazado:'bad',enviado:'warn',solicitado:'warn'})[e]||''}">${esc(ESTADO_PER[e]||ESTADO_ANT[e]||e)}</span>`;

function periodoDefecto(u){
  const ant = mesAnterior(), e = estadoPer(u.id, ant);
  if(e === 'devuelto' || (e === 'abierto' && gastosDe(u.id, ant).length)) return ant;
  return mesActual();
}
function periodosDe(u){
  const s = new Set([mesActual(), mesAnterior()]);
  db.gastos.filter(g => g.userId === u.id).forEach(g => s.add(g.periodo));
  db.periodos.filter(p => p.userId === u.id).forEach(p => s.add(p.periodo));
  return [...s].sort().reverse().slice(0, 8);
}
function selectorPeriodo(u){
  return `<label>Periodo</label><select onchange="per=this.value;editId=null;nuevoGastoId=null;render()">${periodosDe(u).map(p =>
    `<option value="${p}" ${p===per?'selected':''}>${mesNombre(p)} · ${ESTADO_PER[estadoPer(u.id,p)]}</option>`).join('')}</select>`;
}

/* ===== Sesión e inactividad ===== */
function tocar(){ try { localStorage.setItem(ACT, String(Date.now())); } catch(e){} }
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { if(db.sesion) tocar(); }, {passive:true}));
function inactivo(){ return Date.now() - Number(localStorage.getItem(ACT) || 0) > INACTIVIDAD; }
async function cerrarSesion(msg){
  db = {usuarios:[], gastos:[], periodos:[], anticipos:[], topes:{}, centros:[], sesion:null}; fotoUrls = {};
  vista = 'inicio'; per = null; editId = null; editUser = null; aviso = null;
  await sb.auth.signOut().catch(() => {});
  render(); if(msg) toast(msg);
}
setInterval(() => { if(db.sesion && inactivo()) cerrarSesion('Sesión cerrada por 30 minutos de inactividad'); }, 30000);
function validarSesion(){
  const u = yo();
  if(!u){ cerrarSesion('Su usuario no tiene perfil. Consulte con contabilidad.'); return false; }
  if(u.bloqueado){ cerrarSesion('Usuario bloqueado. Pida a contabilidad que lo desbloquee.'); return false; }
  if(u.activo === false){ cerrarSesion('Usuario inactivo. Consulte con contabilidad.'); return false; }
  return true;
}
async function iniciarSesion(){
  const {data:{user}} = await sb.auth.getUser();
  db.sesion = user.id; await cargar();
  if(!validarSesion()) return;
  per = periodoDefecto(yo()); vista = 'inicio'; tocar(); render();
}

/* ===== Navegación ===== */
function renderNav(){
  const u = yo();
  if(!u){ $('#nav').innerHTML = ''; return; }
  let items = [];
  if(debeCambiarClave(u)) items = [['salir','Salir']];
  else {
    items.push(['inicio','Inicio']);
    if(puedeComprobar(u)) items.push(['gastos','Mis gastos'], ['enviar','Enviar periodo']);
    if(puedeComprobar(u) && u.pago === 'anticipo') items.push(['anticipos','Anticipos']);
    if(autorizaA(u).length){ const n = pendientesAutorizar(u); items.push(['autorizar', 'Autorizar' + (n ? `<span class="badge">${n}</span>` : '')]); }
    if(u.rol === 'contabilidad') items.push(['contab','Contabilidad'], ['usuarios','Usuarios']);
    if(u.rol === 'admin') items.push(['dashboard','Dashboard'], ['politicas','Políticas']);
    items.push(['actualizar','Actualizar'], ['clave','Contraseña'], ['salir','Salir']);
  }
  $('#nav').innerHTML = items.map(([k,l]) => `<button class="${vista===k?'on':''}" onclick="ir('${k}')">${l}</button>`).join('');
}
function ir(v){
  aviso = null; editId = null; editUser = null; nuevoGastoId = null;
  if(v === 'salir') return cerrarSesion();
  if(v === 'actualizar') return ejecutar(() => refrescar('Datos actualizados'));
  vista = v; render(); window.scrollTo(0,0);
}
function render(){
  renderNav();
  const u = yo();
  if(!u) return login();
  if(debeCambiarClave(u)){ $('#app').innerHTML = vClave(u, true); return; }
  const fn = {inicio:vInicio, gastos:vGastos, enviar:vEnviar, anticipos:vAnticipos, autorizar:vAutorizar, contab:vContab,
    usuarios:vUsuarios, dashboard:vDashboard, politicas:vPoliticas, clave:u => vClave(u, false)}[vista] || vInicio;
  $('#app').innerHTML = (aviso ? `<div class="card alert ok">${aviso}</div>` : '') + fn(u);
}

/* ===== Acceso ===== */
function login(){
  $('#app').innerHTML = `
  <div class="card" style="max-width:380px;margin:40px auto">
    <h2>Ingresar</h2>
    <label>Usuario</label><input id="lu" autocomplete="username" autocapitalize="none">
    <label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <div class="acciones"><button class="primary" onclick="entrar()">Entrar</button></div>
    <p class="muted">¿Olvidó su contraseña? Pida a contabilidad que la restablezca.</p>
  </div><div id="inicial"></div>`;
  sb.rpc('hay_usuarios').then(({data, error}) => {
    if(error || data || !$('#inicial')) return;
    $('#inicial').innerHTML = `<div class="card" style="max-width:420px;margin:0 auto">
      <h2>Configuración inicial</h2>
      <p class="muted">Aún no hay usuarios. Cree el usuario de contabilidad, que luego dará de alta a los demás.</p>
      <label>Nombre</label><input id="in" value="Contabilidad">
      <label>Puesto</label><input id="ip" value="Contador">
      <label>Usuario para ingresar</label><input id="il" value="contabilidad" autocapitalize="none">
      <label>Celular (WhatsApp)</label><input id="it" inputmode="tel" placeholder="3001234567">
      <div class="acciones"><button class="primary" onclick="configuracionInicial()">Crear usuario de contabilidad</button></div></div>`;
  });
}
function configuracionInicial(){
  ejecutar(async () => {
    const r = await adminUsuarios({accion:'inicial', login:$('#il').value, datos:{nombre:$('#in').value, puesto:$('#ip').value, telefono:$('#it').value}});
    alert(`Usuario de contabilidad creado.\nUsuario: ${r.login}\nContraseña temporal: ${r.clave}\nAnótela: deberá cambiarla al ingresar.`);
    login(); $('#lu').value = r.login;
  });
}
function entrar(){
  const login = $('#lu').value.trim().toLowerCase(), clave = $('#lp').value;
  if(!login || !clave) return toast('Escriba usuario y contraseña');
  ejecutar(async () => {
    const {error} = await sb.auth.signInWithPassword({email: emailDe(login), password: clave});
    if(error){
      if(/invalid login credentials/i.test(error.message)){
        await sb.rpc('login_fallido', {p_login: login});
        throw new Error('Usuario o contraseña incorrectos. A los 5 intentos fallidos el usuario se bloquea.');
      }
      throw new Error(error.message);
    }
    const est = await rpc('login_ok');
    if(est !== 'ok'){
      await sb.auth.signOut();
      throw new Error(est === 'bloqueado' ? 'Usuario bloqueado. Pida a contabilidad que lo desbloquee.'
        : est === 'inactivo' ? 'Usuario inactivo. Consulte con contabilidad.' : 'Su usuario no tiene perfil. Consulte con contabilidad.');
    }
    await iniciarSesion();
  });
}
function vClave(u, forzado){
  return `<div class="card" style="max-width:420px;margin:20px auto">
    <h2>Cambiar contraseña</h2>

    <label>Nueva contraseña</label><input id="cn" type="password" autocomplete="new-password">
    <label>Confirmar nueva contraseña</label><input id="cc" type="password" autocomplete="new-password">

    <div class="acciones"><button class="primary" onclick="guardarClave()">Guardar</button></div>

function guardarClave(){
  const u = yo(), a = $('#ca').value, n = $('#cn').value;
  if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(n)) return toast('Mínimo 8 caracteres, con letras y números');
  if(n === a) return toast('La nueva contraseña debe ser distinta');
  if(n !== $('#cc').value) return toast('La confirmación no coincide');
  ejecutar(async () => {
    const {error: e1} = await sb.auth.signInWithPassword({email: emailDe(u.login), password: a});

    const {error: e2} = await sb.auth.updateUser({password: n});

function avisoTopeHtml(c, valor, n, comentario){
  const tope = db.topes[c.id];

function ajustarForm(){ const c = concepto($('#gc').value); $('#extras').innerHTML = extrasHtml(c); validarTope(); }

  $('#avisoTope').innerHTML = avisoTopeHtml(c, $('#gv').value, $('#gn')?.value, prev);

function comprimir(file, max = 1400, q = 0.7){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error('imagen')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
function guardarGasto(){
  const u = yo(), c = concepto($('#gc').value);
  const edit = editId ? db.gastos.find(x => x.id === editId) : null;
  const fecha = $('#gf').value;
  if(!fecha) return toast('Ingrese la fecha del ticket');
  if(fecha > hoy()) return toast('La fecha no puede ser futura');
  if(fecha.slice(0,7) !== per) return toast(`La fecha debe estar dentro de ${mesNombre(per)}`);
  const valor = Number($('#gv').value || 0);
  if(!(valor > 0)) return toast('Ingrese el valor');
  const id = edit ? edit.id : (nuevoGastoId = nuevoGastoId || uuid());
  const path = `${u.id}/${id}.jpg`;
  const file = $('#gfoto').files[0];
  if(!file && !edit?.fotoPath && !subidas.has(path)) return toast('Adjunte la foto del ticket');
  const empresa = $('#gemp')?.value.trim() || '', personas = $('#gper')?.value.trim() || '';
  const nPersonas = Number($('#gn')?.value || 1);
  if(c.obsequio && !empresa) return toast('Nombre del cliente requerido');
  if(c.cliente && (!empresa || !personas)) return toast('Empresa y nombres de las personas requeridos');
  if(c.comidaIndividual && !$('#gfuera')?.checked) return toast('Comida individual solo aplica fuera de la ciudad o con pernocta');
  const tope = db.topes[c.id], real = c.porPersona ? valor / Math.max(nPersonas, 1) : valor;
  const comentario = $('#gcom')?.value.trim() || '';
  if(tope && real > tope && !comentario) return toast('Escriba el motivo del sobrepresupuesto');
  const d = {id, fecha, concepto:c.id, valor, centro:$('#gcc').value, medio:$('#gm').value, empresa, personas, n_personas:nPersonas,
    fuera: !!$('#gfuera')?.checked, factura: $('#gfact').checked, comentario, foto_path: path};
  ejecutar(async () => {
    if(file){
      const blob = await comprimir(file);
      const {error} = await sb.storage.from('tickets').upload(path, blob, {contentType:'image/jpeg', upsert:true});
      if(error) throw new Error('No se pudo subir la foto: ' + error.message);
      subidas.add(path); delete fotoUrls[path];
    }
    await rpc('guardar_gasto', {d});
    editId = null; nuevoGastoId = null;
    await refrescar(edit ? 'Gasto actualizado' : 'Gasto guardado');
  });
}

/* ===== Envío del periodo ===== */
function textoEnvio(u, p, lista){ return `Comprobación ${mesNombre(p)} completada. ${lista.length} gasto(s) por ${money(sum(lista))}. ${u.nombre}. Revisar en TU comprobación.`; }
function vEnviar(u){
  if(!per) per = periodoDefecto(u);

  const todos = gastosDe(u.id, per), lista = todos.filter(g => g.estado === 'borrador');
  const aut = usuario(u.autoriza), directo = u.sinAutorizador, cont = contabilidad();
  let h = `<div class="card">${selectorPeriodo(u)}</div><div class="card"><h2>Enviar ${mesNombre(per)}</h2>`;
  if(estado === 'enviado'){
    const env = todos.filter(g => g.estado === 'enviado');
    h += `<p>Enviado${aut ? ` a <b>${esc(aut.nombre)}</b>` : ''} el ${r.enviado}. ${tagEstado('enviado')}</p>
      <p class="muted">${env.length} gasto(s) por revisar. Los gastos quedan bloqueados hasta la revisión.</p>
      ${aut ? btnWa('avisar a ' + aut.nombre, aut.telefono, textoEnvio(u, per, env)) : ''}`;
  } else if(estado === 'autorizado'){
    h += `<div class="alert ok">${directo ? 'Enviado a contabilidad' : 'Autorizado'} el ${r.autorizado}. Pasó a contabilidad para finiquitar.</div><p class="total">${money(sum(todos))}</p>

  } else if(estado === 'finiquitado'){
    h += `<div class="alert ok">Finiquitado por contabilidad el ${r.finiquitado}.</div><p class="total">${money(r.total)}</p>${resumenSaldo(u, r)}`;
  } else if(!aut && !directo){
    h += `<div class="alert">No tiene autorizador asignado. Pida a contabilidad que lo defina en la matriz de usuarios.</div>`;
  } else {
    const devueltos = todos.filter(g => g.estado === 'devuelto');
    if(estado === 'devuelto' && devueltos.length)
      h += `<div class="alert bad">Faltan ${devueltos.length} gasto(s) devuelto(s) por corregir o eliminar.</div>
        <button class="ghost" onclick="ir('gastos')">Ir a corregir</button>`;
    else {
      const porC = {}; lista.forEach(g => porC[g.concepto] = (porC[g.concepto] || 0) + g.valor);
      h += `<p>${lista.length} gasto(s) ${estado === 'devuelto' ? 'corregidos ' : ''}por <b class="total">${money(sum(lista))}</b></p>
        ${lista.length ? tabla(Object.entries(porC).map(([k,v]) => `<tr><td>${nombreConcepto(k)}</td><td class="num">${money(v)}</td></tr>`).join('')) : ''}
        <p class="muted">${directo ? 'No tiene autorizador: al enviar, la comprobación pasa <b>directo a contabilidad</b>.' : `Lo autoriza: <b>${esc(aut.nombre)}</b> (${esc(aut.puesto)}).`} Al enviar, los gastos quedan bloqueados.</p>
        <button class="primary" onclick="enviarPeriodo()" ${lista.length ? '' : 'disabled'}>${estado === 'devuelto' ? 'Reenviar corregidos' : directo ? 'Enviar a contabilidad' : 'Enviar a autorización'}</button>`;
    }
  }
  return h + '</div>';

function enviarPeriodo(){
  if(per === mesActual() && !confirm(`${mesNombre(per)} aún no termina. Normalmente se envía al cerrar el mes. ¿Enviar de todas formas?`)) return;
  ejecutar(async () => { await rpc('enviar_periodo', {p_periodo: per}); await refrescar(yo().sinAutorizador ? 'Enviado a contabilidad. Avise por WhatsApp.' : 'Periodo enviado. Avise al autorizador por WhatsApp.'); });
}
function resumenSaldo(u, r){
  if(u.pago === 'anticipo' && r.diferencia != null){
    if(r.diferencia > 0) return `<div class="alert">Anticipo ${money(r.anticipo)} · sobrante ${money(r.diferencia)} a devolver en los primeros días del mes.</div>`;
    if(r.diferencia < 0) return `<div class="alert">Anticipo ${money(r.anticipo)} · faltante ${money(-r.diferencia)} a depositar por contabilidad.</div>`;
    return `<div class="alert ok">Anticipo ${money(r.anticipo)} · saldo en cero.</div>`;
  }
  if(u.pago === 'caja') return `<p class="muted">Reposición de caja: ${money(r.total)}.</p>`;
  if(u.pago === 'tarjeta') return `<p class="muted">Pago de tarjeta: ${money(sum(gastosDe(u.id, r.periodo).filter(g => g.medio === 'tarjeta')))}.</p>`;

/* ===== Anticipos ===== */
function vAnticipos(u){

        ${rev.map(g => { const c = concepto(g.concepto), tope = db.topes[g.concepto];
          const pp = c.porPersona ? g.valor / Math.max(g.nPersonas || 1, 1) : g.valor;
          return `<tr><td><input type="checkbox" class="ck-${p.userId}" value="${g.id}"></td>
          <td>${g.fecha}</td><td>${esc(c.nombre)}${g.corregido ? ' <span class="tag">corregido</span>' : ''}</td>

          <td class="muted">${[g.empresa && esc(g.empresa), g.personas && esc(g.personas) + ` (${g.nPersonas})`, c.comidaIndividual && g.fuera && 'fuera de ciudad/pernocta',
            MEDIOS[g.medio], esc(g.centro), g.factura ? 'factura enviada' : 'sin factura', tope && pp > tope ? `<b style="color:var(--warn)">supera tope: ${esc(g.comentario)}</b>` : ''].filter(Boolean).join(' · ')}</td>
          <td><input id="c-${g.id}" placeholder="Comentario"></td></tr>`; }).join('')}`)}

function todos(userId, on){ document.querySelectorAll('.ck-' + userId).forEach(c => c.checked = on); }
function resolver(userId, periodo, accion){
  const ids = [...document.querySelectorAll('.ck-' + userId + ':checked')].map(c => c.value);
  if(!ids.length) return toast('Seleccione gastos');
  const items = ids.map(id => ({id, comentario: $('#c-' + id).value.trim()}));
  if(accion === 'devolver' && items.some(i => !i.comentario)) return toast('Escriba el comentario de cada gasto devuelto');
  ejecutar(async () => {
    const r = await rpc('resolver_gastos', {p_user: userId, p_periodo: periodo, p_accion: accion, p_items: items});
    await cargar();
    const d = usuario(userId), gs = gastosDe(userId, periodo);
    if(r === 'devuelto'){
      const n = gs.filter(g => g.estado === 'devuelto').length;
      aviso = `Comprobación de ${esc(d.nombre)} devuelta (${n} gasto(s)). ` +
        btnWa('avisar a ' + d.nombre, d.telefono, `Comprobación ${mesNombre(periodo)}: ${n} gasto(s) devuelto(s). Revise los comentarios y corrija en TU comprobación.`);
    } else if(r === 'autorizado'){
      const cont = contabilidad();
      aviso = `Comprobación de ${esc(d.nombre)} autorizada y enviada a contabilidad. ` +
        (cont ? btnWa('avisar a contabilidad', cont.telefono, `Comprobación ${mesNombre(periodo)} de ${d.nombre} autorizada por ${money(sum(gs))}. Lista para finiquitar.`) : '');
    }
    render(); window.scrollTo(0,0);
    if(r === 'parcial') toast(accion === 'aprobar' ? 'Aprobados' : 'Marcados como devueltos');
  });
}
function resolverAnticipo(id, ok){
  let motivo = '';
  if(!ok){ motivo = prompt('Motivo del rechazo') || ''; if(!motivo.trim()) return toast('Escriba el motivo del rechazo'); }
  ejecutar(async () => {
    await rpc('resolver_anticipo', {p_id: id, p_ok: ok, p_motivo: motivo});
    await cargar();
    const a = db.anticipos.find(x => x.id === id), d = usuario(a.userId), cont = contabilidad();
    aviso = ok ? `Anticipo de ${esc(d.nombre)} autorizado. ` + (cont ? btnWa('avisar a contabilidad', cont.telefono, `Anticipo autorizado: ${d.nombre}, ${money(a.monto)} (${a.motivo}). Favor depositar.`) : '')
               : `Anticipo rechazado. ` + btnWa('avisar a ' + d.nombre, d.telefono, `Su solicitud de anticipo por ${money(a.monto)} fue rechazada: ${a.rechazo}`);
    render();
  });
}

function finiquitar(userId, periodo){
  const r = perRec(userId, periodo);
  if(!r.exportado && !confirm('Este periodo no se ha exportado. Al finiquitar se borran las fotos. ¿Continuar?')) return;
  ejecutar(async () => {
    const fotos = await rpc('finiquitar', {p_user: userId, p_periodo: periodo});
    if(fotos?.length) await sb.storage.from('tickets').remove(fotos);
    await refrescar('Periodo finiquitado');
  });
}
function depositar(id){
  ejecutar(async () => {
    await rpc('depositar_anticipo', {p_id: id});
    await cargar();
    const a = db.anticipos.find(x => x.id === id), d = usuario(a.userId);
    aviso = `Depósito confirmado. ` + btnWa('avisar a ' + d.nombre, d.telefono, `Su anticipo por ${money(a.monto)} fue depositado.`);
    render();
  });
}
function filasExport(p){ return db.gastos.filter(g => g.periodo === p && ['aprobado','pagado'].includes(g.estado)); }
const nombreFoto = g => `fotos/${g.periodo}_${usuario(g.userId)?.login}_${g.fecha}_${g.id.slice(0,8)}.jpg`;
function csvMes(p){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Periodo','Colaborador','Usuario','Puesto','Tipo de pago','Centro de costos','Fecha','Concepto','Valor','Medio de pago','Empresa/Cliente','Personas','N personas','Fuera de ciudad','Factura enviada','Comentario','Estado','Foto'];
  const rows = filasExport(p).map(g => { const u = usuario(g.userId) || {};
    return [g.periodo, u.nombre, u.login, u.puesto, PAGOS[u.pago] || '', g.centro, g.fecha, nombreConcepto(g.concepto), g.valor, MEDIOS[g.medio] || g.medio,
      g.empresa, g.personas, g.cliente ? g.nPersonas : '', g.fuera ? 'Sí' : '', g.factura ? 'Sí' : 'No', g.comentario, g.estado === 'pagado' ? 'finiquitado' : 'autorizado', g.fotoPath ? nombreFoto(g) : ''];
  });
  return '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
}
function descargar(blob, nombre){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
function exportarCSV(p){ descargar(new Blob([csvMes(p)], {type:'text/csv;charset=utf-8'}), `comprobaciones_${p}.csv`); }
function exportarZIP(p){
  if(!window.JSZip) return toast('No se pudo cargar el compresor ZIP. Descargue el CSV.');
  ejecutar(async () => {
    const zip = new JSZip(); zip.file(`comprobaciones_${p}.csv`, csvMes(p));
    for(const g of filasExport(p).filter(g => g.fotoPath)){
      const {data, error} = await sb.storage.from('tickets').download(g.fotoPath);
      if(error) throw new Error('No se pudo descargar una foto: ' + error.message);
      zip.file(nombreFoto(g), data);
    }
    descargar(await zip.generateAsync({type:'blob'}), `comprobaciones_${p}.zip`);
    await rpc('marcar_exportado', {p_periodo: p});
    await refrescar('Exportado');
  });
}

      <td class="num">${y.pago === 'tarjeta' ? money(saldoTarjeta(y)) + '<br><span class="muted">de ' + money(y.credito) + '</span>' : y.pago === 'caja' ? money(disponibleCaja(y)) + '<br><span class="muted">de ' + money(y.montoCaja) + '</span>' : '—'}</td>
      <td><button class="ghost sm" onclick="editUser='${y.id}';render();window.scrollTo(0,0)">Editar</button></td></tr>`).join('')}`)}
    <p class="muted">Cajas menores: se dan de alta con rol "Caja menor", su planta, encargado y monto fijo (2.000.000 COP por confirmar).</p>
  </div>`;
}
function ajustarUsuarioForm(){
  const rol = $('#ur')?.value; if(!rol) return;
  const caja = rol === 'caja', comprueba = ['vendedor','lider','caja'].includes(rol);
  document.querySelectorAll('.f-caja').forEach(e => e.classList.toggle('hidden', !caja));
  document.querySelector('.f-pago').classList.toggle('hidden', caja || !comprueba);
  document.querySelector('.f-cupo').classList.toggle('hidden', caja || !comprueba || $('#upg').value !== 'tarjeta');
}
function sugerirLogin(){
  if(editUser !== 'nuevo' || $('#ul').dataset.tocado) return;
  const p = $('#un').value.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);
  $('#ul').value = p.length > 1 ? p[0] + '.' + p[p.length - 1] : (p[0] || '');
}
document.addEventListener('input', e => { if(e.target.id === 'ul') e.target.dataset.tocado = '1'; });
function guardarUsuario(){
  const rol = $('#ur').value, comprueba = ['vendedor','lider','caja'].includes(rol);
  const d = { nombre:$('#un').value.trim(), puesto:$('#up').value.trim(), telefono:$('#ut').value.trim(), rol,
    autoriza:($('#ua').value && $('#ua').value !== '__directo') ? $('#ua').value : null, sin_autorizador: $('#ua').value === '__directo', pago: rol === 'caja' ? 'caja' : comprueba ? $('#upg').value : null, centro:$('#uc').value || null,
    credito:Number($('#ucr').value || 0), monto_caja:Number($('#umc').value || 0), encargado:$('#uen').value.trim() };
  const login = $('#ul').value.trim().toLowerCase();
  if(!d.nombre || !d.puesto) return toast('Nombre y puesto son obligatorios');
  if(editUser === 'nuevo' && !/^[a-z0-9._-]{3,}$/.test(login)) return toast('Usuario: mínimo 3 caracteres, sin espacios ni tildes');
  ejecutar(async () => {
    if(editUser === 'nuevo'){
      const r = await adminUsuarios({accion:'crear', login, datos:d});
      editUser = null; await refrescar();
      alert(`Usuario creado.\nUsuario: ${r.login}\nContraseña temporal: ${r.clave}\nEntréguela a ${d.nombre}; deberá cambiarla al primer ingreso.`);
    } else {
      await rpc('actualizar_usuario', {p_id: editUser, d});
      editUser = null; await refrescar('Usuario actualizado');
    }
  });
}
function restablecer(id){
  const y = usuario(id);
  if(!confirm(`¿Generar una contraseña temporal nueva para ${y.nombre}?`)) return;
  ejecutar(async () => {
    const r = await adminUsuarios({accion:'restablecer', id});
    await refrescar();
    alert(`Nueva contraseña temporal de ${y.nombre} (usuario ${r.login}): ${r.clave}`);
  });
}
function desbloquear(id){ ejecutar(async () => { await rpc('desbloquear_usuario', {p_id: id}); await refrescar('Usuario desbloqueado'); }); }
function activar(id, on){ ejecutar(async () => { await rpc('activar_usuario', {p_id: id, p_activo: on}); editUser = null; await refrescar(on ? 'Usuario reactivado' : 'Usuario desactivado'); }); }

/* ===== Administración ===== */
function vDashboard(u){
  if(!dper) dper = mesActual();
  const meses = [...new Set([mesActual(), mesAnterior(), ...db.gastos.map(g => g.periodo)])].sort().reverse();
  const gs = db.gastos.filter(g => g.periodo === dper);
  const agrupar = f => { const o = {}; gs.forEach(g => { const k = f(g); o[k] = (o[k] || 0) + g.valor; }); return Object.entries(o).sort((a,b) => b[1] - a[1]); };
  const barras = filas => { const max = Math.max(1, ...filas.map(f => f[1]));
    return filas.length ? tabla(filas.map(([k,v]) => `<tr><td style="width:40%">${esc(k)}</td><td><div class="bar" style="width:${(v/max*100).toFixed(1)}%"></div></td><td class="num">${money(v)}</td></tr>`).join(''))
      : '<p class="muted">Sin datos</p>'; };
  const tarjetas = activos().filter(x => x.pago === 'tarjeta');
  const cajas = activos().filter(x => x.pago === 'caja');
  const ants = db.anticipos.filter(a => !['comprobado','rechazado'].includes(a.estado));
  const pers = activos().filter(puedeComprobar);
  return `
  <div class="card"><label>Mes</label><select onchange="dper=this.value;render()">${meses.map(m => `<option value="${m}" ${m===dper?'selected':''}>${mesNombre(m)}</option>`).join('')}</select>
    <p class="total" style="margin:12px 0 0">${money(sum(gs))}</p><p class="muted">${gs.length} gasto(s) registrados en ${mesNombre(dper)} (todos los estados)</p></div>
  <div class="card"><h2>Por concepto</h2>${barras(agrupar(g => nombreConcepto(g.concepto)))}</div>
  <div class="card"><h2>Por planta / centro de costos</h2>${barras(agrupar(g => g.centro))}</div>
  <div class="card"><h2>Por persona</h2>${tabla(`<tr><th>Persona</th><th>Estado del periodo</th><th class="num">Total</th></tr>
    ${pers.map(x => `<tr><td>${esc(x.nombre)}</td><td>${tagEstado(estadoPer(x.id, dper))}</td><td class="num">${money(sum(gs.filter(g => g.userId === x.id)))}</td></tr>`).join('')}`)}</div>
  <div class="card"><h2>Saldos de tarjeta</h2>${tarjetas.length ? tabla(`<tr><th>Persona</th><th class="num">Cupo</th><th class="num">Saldo</th></tr>
    ${tarjetas.map(x => `<tr><td>${esc(x.nombre)}</td><td class="num">${money(x.credito)}</td><td class="num">${money(saldoTarjeta(x))}</td></tr>`).join('')}`) : '<p class="muted">Ninguna</p>'}</div>
  <div class="card"><h2>Anticipos pendientes</h2>${ants.length ? tabla(`<tr><th>Persona</th><th class="num">Monto</th><th>Estado</th><th>Desde</th></tr>
    ${ants.map(a => `<tr><td>${esc(usuario(a.userId)?.nombre)}</td><td class="num">${money(a.monto)}</td><td>${tagEstado(a.estado)}</td><td>${a.fecha}</td></tr>`).join('')}`) : '<p class="muted">Ninguno</p>'}</div>
  <div class="card"><h2>Cajas menores</h2>${cajas.length ? tabla(`<tr><th>Caja</th><th>Encargado</th><th class="num">Monto fijo</th><th class="num">Disponible</th></tr>
    ${cajas.map(x => `<tr><td>${esc(x.nombre)}</td><td>${esc(x.encargado || '—')}</td><td class="num">${money(x.montoCaja)}</td><td class="num">${money(disponibleCaja(x))}</td></tr>`).join('')}`) : '<p class="muted">Ninguna</p>'}</div>`;
}
function vPoliticas(u){
  return `<div class="card"><h2>Topes por concepto</h2>
    <p class="muted">Vacío = sin tope. En comidas y cafés con cliente el tope es por persona. Si un gasto lo supera, la app pide el motivo.</p>
    ${tabla(`<tr><th>Concepto</th><th>Tope (COP)</th></tr>${CONCEPTOS.map(c => `<tr><td>${c.nombre}${c.porPersona ? ' <span class="muted">(por persona)</span>' : ''}</td>
      <td><input id="t-${c.id}" type="number" min="0" value="${db.topes[c.id] || ''}" style="max-width:180px"></td></tr>`).join('')}`)}
    <div class="acciones"><button class="primary" onclick="guardarTopes()">Guardar topes</button></div>
    <p class="muted">Pendiente: topes distintos por rol cuando llegue la política de inventario.</p></div>
  <div class="card"><h2>Centros de costos</h2>
    <p>${db.centros.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</p>
    <div class="row"><div><input id="ncc" placeholder="Nuevo centro de costos"></div><div><button class="ghost" onclick="agregarCentro()">Agregar</button></div></div></div>`;
}
function guardarTopes(){
  const d = {}; CONCEPTOS.forEach(c => { const v = Number($('#t-' + c.id).value || 0); if(v > 0) d[c.id] = v; });
  ejecutar(async () => { await rpc('guardar_topes', {d}); await refrescar('Topes guardados'); });
}
function agregarCentro(){
  const v = $('#ncc').value.trim(); if(!v) return;
  ejecutar(async () => { await rpc('agregar_centro', {p_nombre: v}); await refrescar('Centro agregado'); });
}

/* ===== Arranque ===== */
(async () => {
  try {
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return render();
    if(inactivo()) return cerrarSesion('Sesión cerrada por 30 minutos de inactividad');
    const est = await rpc('login_ok');
    if(est !== 'ok') return cerrarSesion(est === 'bloqueado' ? 'Usuario bloqueado. Pida a contabilidad que lo desbloquee.' : 'Usuario inactivo. Consulte con contabilidad.');
    await iniciarSesion();
  } catch(e){ console.error(e); $('#app').innerHTML = `<div class="card alert bad">No se pudo conectar: ${esc(e.message)}. <button class="ghost sm" onclick="location.reload()">Reintentar</button></div>`; }
})();
</script>
</body>
</html>
